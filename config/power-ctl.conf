# power-ctl user configuration
# Installed to /etc/power-ctl.conf — safe to edit, not overwritten on upgrade.

# Auto-switch to performance when AC is plugged in.
#   0 (default) — notify only, user picks via Mod+B
#   1           — switch balanced/power-saver → performance automatically
# Manual selections (boost, or a profile chosen while on AC) are always
# preserved either way.
AUTO_AC_SWITCH=0
